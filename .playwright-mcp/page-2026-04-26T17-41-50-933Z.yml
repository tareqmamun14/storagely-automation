            - listitem [ref=e1728]: Vinyl records
            - listitem [ref=e1729]: Artwork
            - listitem [ref=e1730]: Photographs
            - listitem [ref=e1731]: And more!
          - heading "Accessible Colorado Springs Drive-Up Storage Units" [level=3] [ref=e1732]:
            - text: Accessible Colorado Springs
            - link "Drive-Up Storage Units" [ref=e1733] [cursor=pointer]:
              - /url: https://www.storagestar.com/drive-up-storage
          - paragraph [ref=e1734]: At Storage Star, we aim to simplify your life by offering convenient self-storage solutions. We focus on accessibility, providing a wide range of ground-floor and drive-up access storage units. With access hours available every day from 6:00 a.m. to 10:00 p.m., you’ll have the flexibility to visit your storage unit at a time that suits your schedule. Our goal is to ensure your storage experience is hassle-free and convenient.
          - paragraph [ref=e1735]: "Drive-up units are great when you need to:"
